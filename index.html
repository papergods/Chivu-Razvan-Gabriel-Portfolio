    <style>
        body {
            background-color: #0e1111;
            color: #e5e7eb;
            overflow-x: hidden;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0e1111;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d2d;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00a2ff;
        }

        .ue-panel {
            background-color: rgba(26, 29, 29, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid #2a2d2d;
            transition: all 0.3s ease;
        }
        .ue-panel:hover {
            border-color: #00a2ff;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.15);
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(0, 162, 255, 0.5);
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        #blueprint-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        /* --- EXPERIENCE CARDS HOVER LOGIC --- */
        .exp-card {
            position: relative;
            height: 220px;
            display: flex;
            align-items: center;
            overflow: hidden;
            background-color: #1a1d1d;
            border: 1px solid #2a2d2d;
            border-radius: 0.375rem;
            transition: all 0.4s ease;
        }
        .exp-card:hover {
            border-color: #00a2ff;
            box-shadow: 0 0 20px rgba(0, 162, 255, 0.1);
        }
        .exp-logo {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 120px;
            max-height: 120px;
            object-fit: contain;
            filter: grayscale(80%) opacity(0.7);
        }
        .exp-card:hover .exp-logo {
            left: 30px;
            transform: translateX(0);
            filter: grayscale(0%) opacity(1);
        }
        .exp-details {
            opacity: 0;
            transform: translateX(30px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            margin-left: 180px; /* Make room for the logo on the left */
            padding-right: 30px;
            pointer-events: none;
        }
        .exp-card:hover .exp-details {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* --- SKILL BADGES HOVER LOGIC --- */
        .skill-badge {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .skill-badge .detail-text {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.875rem;
            color: #8a9393;
            margin-top: 0;
        }
        .skill-badge:hover .detail-text {
            max-height: 250px;
            opacity: 1;
            margin-top: 1.25rem;
        }
        .skill-badge:hover i.icon-main {
            color: #00a2ff;
            transform: scale(1.1);
        }

        /* --- PROJECT CARDS --- */
        .project-card {
            position: relative;
            overflow: hidden;
        }
        .project-card:hover .steam-btn {
            background-color: #00a2ff;
            color: #0e1111;
            border-color: #00a2ff;
        }
    </style>
</head>

    <!-- JS SCRIPTS -->
    <script>
        // Navbar blur on scroll
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('py-2');
                navbar.classList.remove('py-4');
            } else {
                navbar.classList.add('py-4');
                navbar.classList.remove('py-2');
            }
        });

        // Intersection Observer for scroll animations
        const revealElements = document.querySelectorAll('.reveal');
        const revealObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            root: null,
            threshold: 0.1,
            rootMargin: "0px 0px -50px 0px"
        });
        revealElements.forEach(el => revealObserver.observe(el));

        // Background Node Canvas Logic
        const canvas = document.getElementById('blueprint-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let nodes = [];
        
        const config = {
            nodeCount: window.innerWidth < 768 ? 30 : 60,
            maxDistance: 150,
            nodeColor: 'rgba(255, 255, 255, 0.05)',
            lineColor: 'rgba(0, 162, 255, 0.1)' 
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', () => {
            resize();
            initNodes();
        });

        class Node {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.radius = Math.random() * 1.5 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = config.nodeColor;
                ctx.fill();
            }
        }

        function initNodes() {
            nodes = [];
            for (let i = 0; i < config.nodeCount; i++) {
                nodes.push(new Node());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < config.maxDistance) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        const opacity = 1 - (distance / config.maxDistance);
                        ctx.strokeStyle = `rgba(0, 162, 255, ${opacity * 0.2})`; 
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            nodes.forEach(node => {
                node.update();
                node.draw();
            });

            requestAnimationFrame(animate);
        }

        resize();
        initNodes();
        animate();
    </script>
</body>
